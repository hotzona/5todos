<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5todos — Internal Content Creator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">
    <div class="border-b border-gray-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black text-indigo-400">5todos Creator Studio</h1>
        <p class="text-xs text-gray-400">Internal tool to build valid JSON entries for data/todos.json</p>
      </div>
      <a href="index.html" class="text-xs text-gray-400 hover:text-white underline">← Back to Main Site</a>
    </div>

    <form id="creator-form" class="space-y-4 bg-gray-800/50 p-6 rounded-2xl border border-gray-700">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Unique ID (slug)</label>
          <input type="text" id="id" placeholder="e.g., wifi-router-setup" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Category</label>
          <select id="category" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
            <option value="tech">Tech & Cyber</option>
            <option value="health">Health & Emergency</option>
            <option value="finance">Money & Career</option>
            <option value="travel">Travel & Transit</option>
            <option value="life">Home & Life</option>
            <option value="hobbies">Hobbies & Fun</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Title (starts with '...when you')</label>
        <input type="text" id="title" placeholder="e.g., ...set up a new home Wi-Fi router" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Description</label>
        <input type="text" id="desc" placeholder="Brief summary of why this list matters." required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="router, wifi, security, home" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Source Name (Optional)</label>
          <input type="text" id="sourceName" placeholder="e.g., CISA Security Guide" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-300">Source URL (Optional)</label>
          <input type="url" id="sourceUrl" placeholder="https://..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
        </div>
      </div>

      <div class="space-y-2 pt-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-indigo-400">The 5 Steps (Must be exactly 5)</label>
        <input type="text" id="step1" placeholder="1. Change the default admin router password immediately." required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
        <input type="text" id="step2" placeholder="2. Update the network name (SSID) to remove personal identifying details." required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
        <input type="text" id="step3" placeholder="3. Set wireless security encryption to WPA3 or WPA2-Personal." required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
        <input type="text" id="step4" placeholder="4. Create a separate isolated guest Wi-Fi network for smart devices." required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
        <input type="text" id="step5" placeholder="5. Enable automatic firmware security update downloads." required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
      </div>

      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all">Generate JSON Block</button>
    </form>

    <div class="space-y-2">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold uppercase tracking-wider text-gray-300">Output JSON</label>
        <button id="copy-btn" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded-lg text-indigo-400 border border-gray-700">Copy JSON</button>
      </div>
      <textarea id="json-output" readonly rows="8" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-4 font-mono text-xs text-emerald-400 outline-none"></textarea>
    </div>
  </div>

  <script>
    const form = document.getElementById('creator-form');
    const output = document.getElementById('json-output');
    const copyBtn = document.getElementById('copy-btn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const tagsArray = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t);
      const entry = {
        id: document.getElementById('id').value.trim(),
        category: document.getElementById('category').value,
        title: document.getElementById('title').value.trim(),
        desc: document.getElementById('desc').value.trim(),
        tags: tagsArray,
        sourceName: document.getElementById('sourceName').value.trim() || null,
        sourceUrl: document.getElementById('sourceUrl').value.trim() || null,
        affiliate: null,
        todos: [
          document.getElementById('step1').value.trim(),
          document.getElementById('step2').value.trim(),
          document.getElementById('step3').value.trim(),
          document.getElementById('step4').value.trim(),
          document.getElementById('step5').value.trim()
        ]
      };

      output.value = JSON.stringify(entry, null, 2) + ',';
    });

    copyBtn.addEventListener('click', () => {
      if (!output.value) return;
      navigator.clipboard.writeText(output.value);
      copyBtn.innerText = 'Copied!';
      setTimeout(() => copyBtn.innerText = 'Copy JSON', 2000);
    });
  </script>
</body>
</html>
