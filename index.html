<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5todos - Clear, verified 5-step checklists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700/80 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center gap-2 font-black text-xl tracking-tight text-indigo-600 dark:text-indigo-400">
        <span class="bg-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm">5</span>
        <span>todos</span>
      </a>
      <a href="/creator.html" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
        + Add Checklist
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-8">
    
    <!-- Hero Banner -->
    <div class="text-center max-w-2xl mx-auto space-y-3">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white">
        The first 5 things to do when...
      </h1>
      <p class="text-base sm:text-lg text-gray-600 dark:text-gray-400">
        Clear, verified step-by-step protocols for life, tech, travel, health, and emergencies.
      </p>
    </div>

    <!-- Search & Category Filters -->
    <div class="space-y-4 max-w-3xl mx-auto">
      <!-- Search Input -->
      <div class="relative">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search checklists (e.g. car accident, router, passport)..." 
          class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm sm:text-base"
        />
        <svg class="w-5 h-5 absolute left-4 top-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- Category Filter Pills -->
      <div id="category-pills" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
        <button data-category="all" class="cat-btn px-4 py-1.5 rounded-full font-semibold text-xs sm:text-sm transition-all bg-indigo-600 text-white shadow-xs">All</button>
        <button data-category="tech" class="cat-btn px-4 py-1.5 rounded-full font-medium text-xs sm:text-sm transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Tech</button>
        <button data-category="travel" class="cat-btn px-4 py-1.5 rounded-full font-medium text-xs sm:text-sm transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Travel</button>
        <button data-category="health" class="cat-btn px-4 py-1.5 rounded-full font-medium text-xs sm:text-sm transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Health</button>
        <button data-category="finance" class="cat-btn px-4 py-1.5 rounded-full font-medium text-xs sm:text-sm transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Finance</button>
        <button data-category="emergencies" class="cat-btn px-4 py-1.5 rounded-full font-medium text-xs sm:text-sm transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Emergencies</button>
      </div>
    </div>

    <!-- Featured Daily Card Container -->
    <div id="daily-card" class="max-w-3xl mx-auto"></div>

    <!-- Checklist Cards Grid Container -->
    <div id="todos-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
      <!-- Dynamically populated by app.js -->
    </div>

  </main>

  <!-- Modal for Checklist Details -->
  <div id="todo-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-100 dark:border-gray-700 relative max-h-[90vh] overflow-y-auto">
      <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded-lg transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 py-6 mt-12 text-center text-xs text-gray-400">
    <p>&copy; 5todos. Clear protocols when you need them most.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
