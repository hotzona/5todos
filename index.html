<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5todos — The First 5 Things to Do When Doing Anything</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- HEADER -->
  <header class="border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-1.5 rounded-lg">
          <i data-lucide="check-square" class="w-6 h-6"></i>
        </div>
        <span class="font-extrabold text-2xl tracking-tight bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent dark:from-indigo-400 dark:to-violet-400">
          5todos<span class="text-xs font-medium text-gray-500 dark:text-gray-400 ml-1">.com</span>
        </span>
      </a>

      <div class="flex items-center gap-2">
        <button id="surprise-btn" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:hover:bg-indigo-900/60 dark:text-indigo-300 text-xs font-bold transition-all">
          <i data-lucide="shuffle" class="w-4 h-4"></i> Surprise Me!
        </button>

        <button id="theme-toggle" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
          <i data-lucide="sun" class="w-5 h-5 text-amber-500 dark:text-indigo-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN AREA -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-10">
    
    <!-- HERO & SEARCH -->
    <section class="text-center space-y-4 py-2">
      <h1 class="text-3xl md:text-5xl font-black tracking-tight leading-tight">
        The first <span class="text-indigo-600 dark:text-indigo-400">5 things to do</span> when you...
      </h1>
      
      <!-- Instant Search Bar -->
      <div class="max-w-lg mx-auto relative pt-2">
        <div class="absolute inset-y-0 left-0 pl-4 pt-2 flex items-center pointer-events-none text-gray-400">
          <i data-lucide="search" class="w-5 h-5"></i>
        </div>
        <input type="text" id="search-input" placeholder="Search checklists (e.g., stroke, gmail, hotel)..." class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 focus:border-indigo-500 dark:focus:border-indigo-400 outline-none text-sm shadow-sm transition-all">
      </div>
    </section>

    <!-- DAILY / FEATURED CONTAINER -->
    <section id="daily-card-container"></section>

    <!-- ALL LISTINGS GRID -->
    <section class="space-y-4">
      <h3 class="text-xl font-bold tracking-tight">Explore All 5todos</h3>
      <div id="listings-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 py-8 mt-12">
    <div class="max-w-4xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-gray-400">
      <div>&copy; 2026 5todos.com. Curated with absolute focus.</div>
      <div class="flex gap-4">
  <a href="#" class="hover:text-indigo-500">Privacy</a>
</div>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
