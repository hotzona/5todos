<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5todos — The First 5 Things to Do When Doing Anything</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- HEADER -->
  <header class="border-b border-gray-200/60 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-1 rounded-md">
          <i data-lucide="check-square" class="w-4 h-4"></i>
        </div>
        <span class="font-extrabold text-lg tracking-tight text-gray-900 dark:text-white">
          5todos<span class="text-xs font-normal text-gray-400 ml-0.5">.com</span>
        </span>
      </a>

      <div class="flex items-center gap-2">
        <button id="surprise-btn" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/60 dark:text-indigo-300 text-xs font-semibold transition-all">
          <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> Surprise Me
        </button>

        <button id="theme-toggle" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          <i data-lucide="sun" class="w-4 h-4 text-amber-500 dark:text-indigo-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN AREA -->
  <main class="max-w-2xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
    
    <!-- MAIN HERO SUBJECT LINE -->
    <section class="text-center space-y-2 pt-2 pb-1">
      <h1 class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight leading-tight">
        The first <span class="text-indigo-600 dark:text-indigo-400">5 things to do</span> when you...
      </h1>
      <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">Clear, verified checklists for life, tech, travel, and emergencies.</p>
    </section>

    <!-- SEARCH & CATEGORY BAR -->
    <section class="space-y-3">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input type="text" id="search-input" placeholder="Search checklists (e.g., wifi, hotel, iphone)..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/80 focus:border-indigo-500 dark:focus:border-indigo-400 outline-none text-xs sm:text-sm shadow-2xs transition-all">
      </div>

      <!-- Updated Category Filter Pills -->
      <div id="category-pills" class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
        <button data-category="all" class="cat-btn px-3.5 py-1 rounded-full font-semibold transition-all bg-indigo-600 text-white shadow-xs">All</button>
        <button data-category="tech" class="cat-btn px-3.5 py-1 rounded-full font-medium transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Tech</button>
        <button data-category="travel" class="cat-btn px-3.5 py-1 rounded-full font-medium transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Travel</button>
        <button data-category="health" class="cat-btn px-3.5 py-1 rounded-full font-medium transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Health</button>
        <button data-category="finance" class="cat-btn px-3.5 py-1 rounded-full font-medium transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Finance</button>
        <button data-category="life" class="cat-btn px-3.5 py-1 rounded-full font-medium transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Life</button>
        <button data-category="hobbies" class="cat-btn px-3.5 py-1 rounded-full font-medium transition-all text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white">Hobbies</button>
      </div>
    </section>

    <!-- FEATURED / DAILY CHECKLIST CARD -->
    <section id="daily-section">
      <div id="daily-card-container"></div>
    </section>

    <!-- COMPACT EXPLORE LISTINGS -->
    <section class="space-y-2.5">
      <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 pl-1">Library</h3>
      <div id="listings-grid" class="space-y-2"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="border-t border-gray-200/50 dark:border-gray-800/50 py-6 mt-8">
    <div class="max-w-2xl mx-auto px-4 flex justify-between items-center text-xs text-gray-400">
      <div>&copy; 2026 5todos.com</div>
      <a href="privacy.html" class="hover:text-indigo-500 transition-colors">Privacy</a>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
